name: Build Final Release APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
        
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore android/app/vaultify-release.keystore -alias vaultify -keyalg RSA -keysize 2048 -validity 10000 -storepass vaultify123 -keypass vaultify123 -dname "CN=Vaultify, OU=App, O=Vaultify, L=Delhi, S=Delhi, C=IN"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          
      - uses: actions/upload-artifact@v4
        with:
          name: Vaultify-Final-APK
          path: android/app/build/outputs/apk/release/app-release.apk
